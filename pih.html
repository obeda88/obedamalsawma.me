        <script>
            // Lock orientation to landscape using Screen Orientation API
            function lockLandscape() {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {
                        // Silently ignore if not supported (e.g., desktop browsers)
                        console.log('Orientation lock not supported:', err.message);
                    });
                } else if (window.screen.lockOrientation) {
                    window.screen.lockOrientation('landscape');
                } else if (window.screen.mozLockOrientation) {
                    window.screen.mozLockOrientation('landscape');
                } else if (window.screen.msLockOrientation) {
                    window.screen.msLockOrientation('landscape');
                }
            }

            // Resize canvas to fill viewport while maintaining 16:9 aspect ratio
            function resizeCanvas() {
                var canvas = document.getElementById('canvas');
                if (!canvas) return;
                var aspectRatio = 1920 / 1080;
                var windowW = window.innerWidth;
                var windowH = window.innerHeight;
                var canvasW, canvasH;
                if (windowW / windowH >= aspectRatio) {
                    canvasH = windowH;
                    canvasW = windowH * aspectRatio;
                } else {
                    canvasW = windowW;
                    canvasH = windowW / aspectRatio;
                }
                canvas.style.width  = canvasW + 'px';
                canvas.style.height = canvasH + 'px';
            }

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', function() {
                setTimeout(resizeCanvas, 200);
            });

            window.onload = function() {
                lockLandscape();
                resizeCanvas();
                GameMaker_Init();
            };
        </script>
